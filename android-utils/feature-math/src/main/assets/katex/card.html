<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="katex.min.css">
<script src="katex.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  body { font: 16px/1.4 sans-serif; color: #000; overflow-y: hidden; -webkit-text-size-adjust: 100%; }
  .row { overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
  .row::-webkit-scrollbar { display: none; }
  #preview { font-size: 1.1em; margin: 2px 0 6px; }
  .ans { font-size: 1.55em; margin: 2px 0; }
  .note { font-size: .86em; margin: 4px 0 0; }
  #steps { margin-top: 10px; }
  .step { margin: 0 0 10px; }
  .cap { font-size: .8em; font-weight: 600; }
  .step .row { font-size: 1.05em; }
  .katex { font-size: 1em; }
</style>
</head>
<body>
<div id="preview" class="row"></div>
<div id="answers"></div>
<div id="notes"></div>
<div id="steps"></div>
<script>
  function put(el, tex, display) {
    try { katex.render(tex, el, { throwOnError: false, displayMode: display, output: 'html', strict: 'ignore' }); }
    catch (e) { el.textContent = tex; }
  }
  function div(parent, cls) { var d = document.createElement('div'); d.className = cls; parent.appendChild(d); return d; }
  function report() {
    var h = Math.ceil(document.body.getBoundingClientRect().height);
    if (window.Android && Android.height) Android.height(h);
  }
  // c = { preview, answers: [tex], notes: [text], steps: [{c, l}], fg, muted, accent }
  function render(c) {
    document.body.style.color = c.fg;
    var p = document.getElementById('preview');
    p.style.color = c.muted; p.textContent = '';
    if (c.preview) put(p, c.preview, false);
    var a = document.getElementById('answers'); a.textContent = '';
    c.answers.forEach(function (t) { var r = div(a, 'row ans'); r.style.color = c.accent; put(r, t, false); });
    var n = document.getElementById('notes'); n.textContent = '';
    c.notes.forEach(function (t) { var r = div(n, 'note'); r.style.color = c.muted; r.textContent = t; });
    var s = document.getElementById('steps'); s.textContent = '';
    c.steps.forEach(function (st) {
      var box = div(s, 'step');
      var cap = div(box, 'cap'); cap.style.color = c.muted; cap.textContent = st.c;
      if (st.l) { var r = div(box, 'row'); put(r, st.l, false); }
    });
    report();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(report);
  }
</script>
</body>
</html>
