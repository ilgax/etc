name: speaker-kill-switch

on:
  push:
    paths:
      - 'speaker-kill-switch/**'
      - '.github/workflows/speaker-kill-switch.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: speaker-kill-switch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: SpeakerKillSwitch
          path: speaker-kill-switch/app/build/outputs/apk/release/app-release.apk
